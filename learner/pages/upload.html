<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../public/settings.png">
  <title>Send Large Files</title>
  <style>
    body {
      background: rgb(46, 52, 65);
      box-sizing: border-box;
    }
    .main {
      background: rgb(46, 52, 65);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 99vh;
      flex-direction: column;
    }
    .file-chooser, .prompt-area, .response-div{
      font-size: 60px;
      font-family: monospace;
      cursor: pointer;
      border-radius: 4px;
      background: rgb(35, 40, 49);
      color: white;
      font-size: 24px;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 0px;
      text-align: center;
      padding: 20px;
    }
    .file-chooser {
      border-bottom-left-radius: 0px;
      border-bottom-right-radius: 0px;
    }
    #file-chooser {
      display: none;
    }
    .file-chooser:hover {
      background: rgba(255, 255, 255, 0.089);
    }
    .selected-files {
      max-width: 500px;
      min-width: 316px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      min-height: 60px;
      font-size: 14px;
      font-family: Arial, Helvetica, sans-serif;
      grid-gap: 10px;
    }
    
    .main-control > button {
      border: 1.5px solid rgb(186, 186, 186);
      border-radius: 4px;
      background: rgb(35, 40, 49);
      color: rgb(255, 255, 255);
      font-size: 24px;
      max-width: 160px;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 0px;
      text-align: center;
    }
    .main-control > button {
      cursor: pointer;
      padding: 5px 13px;
    }
    .selected-files > div {
      color: rgb(98, 255, 31);
      background-color: rgba(255, 255, 255, 0.039);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      overflow: hidden;
      text-align: left;
      border-radius: 6px;
    }
    .prompt-area {
      margin-bottom: 20px;
    }
    .prompt-area > input {
      border: 1.5px solid rgb(255, 255, 255);
      border-radius: 4px;
      background: rgb(35, 40, 49);
      color: white;
      font-size: 24px;
      width: 100%;
      max-height: 200px;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 0px;
      text-align: center;
      margin-bottom: 10px;
    }
    .response-div {
      margin-top: 10px;
    }
    .response-div > div {
      padding: 36px 0px;
    }
  </style>
</head>
<body>
  <main class="main">
    <label for="file-chooser" class="file-chooser">
      Select Files to Upload
    </label>
    <input id="file-chooser" type="file">
    <div class="prompt-area">
      <input type="text">
      <div class="selected-files">
      </div>
    </div>
    <div class="main-control">
      <button type="button">Accept</button>
    </div>
    <div class="response-div">
    </div>
  </main>
</body>
<script>
  const fileChooser = document.querySelector('#file-chooser')
  const fileViewDiv = document.querySelector('.selected-files')
  const promptElement = document.querySelector('.prompt-area > input')
  const upload = document.querySelector('.main-control > button')
  const responseDiv = document.querySelector('.response-div')

  fileChooser.addEventListener('change', (event) => {
    for (const file of event.target.files) {
      const fileView = document.createElement("div")
      fileView.innerHTML = String(file.name)
      fileViewDiv.appendChild(fileView)
    }
  })

  upload.addEventListener('click', async (event) => {
    event.preventDefault()

    const formData = new FormData()
    formData.append("model", "gemini-2.5-flash")
    formData.append("history", `[
      {
        "role": "user",
        "parts": [{ "text": "Hello gemini! Can you describe yourself in two words?" }]
      },
      {
        "role": "model",
        "parts": [{ "text": "I am helpful and informative." }]
      }
    ]`)
    formData.append("messageText", promptElement.value)

    for (const file of fileChooser.files) {
      formData.append("files", file)
    }

    const response = await fetch("http://localhost:5500/eienzenai/generate", 
    {
      method: "POST",
      body: formData
    });
    const reader = response.body.getReader()
    const decoder = new TextDecoder("utf-8")

    while (true) {
      const { value, done } = await reader.read()
      console.log(value)
      if (done) {
        console.log(done)
        break;
      }

      const chunkDiv = document.createElement("div")
      chunkDiv.innerText = decoder.decode(value, { stream: true })
      responseDiv.appendChild(chunkDiv)
    }
  })

</script>
</html>
